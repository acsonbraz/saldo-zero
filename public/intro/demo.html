<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo da intro (QA)</title>
<style>
html,body{margin:0;height:100%;background:#101114;color:#f1e9d2;font-family:system-ui,sans-serif}
.stage{position:relative;width:100%;max-width:var(--w,430px);height:100%;margin:0 auto;overflow:hidden;background:#101114}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.stage img.on{opacity:1}
.cap{position:absolute;left:16px;right:16px;bottom:96px;margin:0;text-align:center;font:700 20px/1.25 system-ui,sans-serif;color:#f1e9d2;text-shadow:0 2px 0 #101114,0 0 8px #101114}
.skip{position:absolute;right:16px;bottom:24px;min-height:44px;min-width:96px;padding:0 20px;border:2px solid #101114;border-radius:6px;background:#e8b23a;color:#101114;font:700 16px system-ui;box-shadow:0 3px 0 #8a5a0c}
.dots{position:absolute;left:16px;bottom:38px;display:flex;gap:5px}.dots i{width:8px;height:8px;background:#f1e9d2;opacity:.35}.dots i.on{opacity:1;background:#e8b23a}
</style>
</head>
<body>
<div class="stage" id="st"><p class="cap" id="cap"></p><div class="dots" id="dots"></div><button class="skip" id="skip">Pular</button></div>
<script>
var q=new URLSearchParams(location.search), still=q.has('slide');
if(q.has("w"))document.documentElement.style.setProperty("--w",q.get("w")+"px");
var st=document.getElementById('st'),cap=document.getElementById('cap'),dots=document.getElementById('dots'),skip=document.getElementById('skip');
var data,imgs=[],i=-1,timer,audio;
fetch('intro.json').then(function(r){return r.json()}).then(function(d){
  data=d;
  d.slides.forEach(function(s){var im=new Image();im.alt='';im.src=s.file;st.insertBefore(im,cap);imgs.push(im);dots.appendChild(document.createElement('i'))});
  if(still){go(+q.get('slide')-1,true);return}
  go(0);
  try{audio=new Audio(d.music.replace(/^\//,'../'));audio.volume=.8;audio.play().catch(function(){})}catch(e){}
});
function go(n,freeze){
  clearTimeout(timer);
  if(n>=data.slides.length){end();return}
  i=n;
  imgs.forEach(function(im,k){im.classList.toggle('on',k===n)});
  [].forEach.call(dots.children,function(d,k){d.classList.toggle('on',k===n)});
  cap.textContent=data.slides[n].caption;
  if(!freeze)timer=setTimeout(function(){go(n+1)},data.slides[n].ms);
}
function end(){clearTimeout(timer);if(audio)audio.pause();cap.textContent='Fim da intro (o jogo começa aqui).';imgs.forEach(function(im){im.classList.remove('on')});skip.hidden=true}
skip.onclick=function(){if(audio&&audio.paused&&i<0)audio.play();go(i+1)};
</script>
</body>
</html>
