<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Brasília ao entardecer com jatinho, bandeirinhas de festa e silhuetas brindando">
<style>
.fb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.s5j{animation:s5j 3.5s ease-in infinite}@keyframes s5j{from{transform:translate(-120px,60px)}to{transform:translate(520px,-60px)}}
.s5b{transform-box:fill-box;transform-origin:50% 0;animation:s5b 2.8s ease-in-out infinite alternate}@keyframes s5b{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.s5t{animation:s5t 2.4s ease-in-out infinite}@keyframes s5t{0%,100%{opacity:1}50%{opacity:.45}}.s5t.b{animation-delay:-.8s}.s5t.c{animation-delay:-1.6s}
.s5h{animation:s5h 1.2s ease-in-out infinite alternate}@keyframes s5h{from{transform:translateY(0)}to{transform:translateY(-8px)}}

</style>
