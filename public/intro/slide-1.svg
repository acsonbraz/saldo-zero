@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.s1a{animation:s1a 2s linear infinite}@keyframes s1a{to{transform:translateX(60px)}}
.s1b{animation:s1b 3.4s ease-in-out infinite alternate}@keyframes s1b{from{transform:rotate(-2deg) scale(1)}to{transform:rotate(2deg) scale(1.03)}}
.s1c{animation:s1c 1.6s ease-in-out infinite}@keyframes s1c{0%,100%{transform:scale(1) rotate(-9deg)}50%{transform:scale(1.1) rotate(-9deg)}}
.s1d{animation:s1d 3s ease-in-out infinite}@keyframes s1d{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

</style>
