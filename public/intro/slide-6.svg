<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Viatura da Polícia Federativa com luzes piscando e fita de isolamento">
<style>
.fb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.s6a{animation:s6a 1s steps(1) infinite}@keyframes s6a{0%{opacity:1}50%{opacity:.3}}
.s6b{animation:s6b 1s steps(1) infinite}@keyframes s6b{0%{opacity:.3}50%{opacity:1}}
.s6t{transform-box:fill-box;transform-origin:0 50%;animation:s6t 3.2s ease-in-out infinite}@keyframes s6t{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1deg) skewX(2deg)}}
.s6w{animation:s6w 3.5s ease-in-out infinite}@keyframes s6w{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}

</style>
