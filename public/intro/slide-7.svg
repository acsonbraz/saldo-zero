<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Televisão com plantão de notícias e faixa vermelha ao vivo">
<style>
.fb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.s7t{animation:s7t 3.5s linear infinite}@keyframes s7t{from{transform:translateX(0)}to{transform:translateX(-160px)}}
.s7d{animation:s7d 1.2s steps(1) infinite}@keyframes s7d{0%{opacity:1}60%{opacity:.2}}
.s7w{transform-box:fill-box;transform-origin:50% 100%;animation:s7w 2s ease-out infinite}@keyframes s7w{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.s7s{animation:s7s 2.6s linear infinite}@keyframes s7s{from{transform:translateY(0)}to{transform:translateY(12px)}}
.s7a{transform-box:fill-box;transform-origin:50% 100%;animation:s7a 2.2s ease-in-out infinite}@keyframes s7a{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

</style>
