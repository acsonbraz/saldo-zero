<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Silhueta anônima com a chave de um cofre antigo cheio de moedas">
<style>
.fb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.s3r{animation:s3r 3.5s ease-in-out infinite}@keyframes s3r{0%,100%{opacity:.45}50%{opacity:.85}}
.s3d{transform-box:fill-box;transform-origin:0% 50%;animation:s3d 3.5s ease-in-out infinite alternate}@keyframes s3d{from{transform:scaleX(.9)}to{transform:scaleX(.55)}}
.s3k{transform-box:fill-box;transform-origin:50% 0;animation:s3k 2.4s ease-in-out infinite}@keyframes s3k{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.s3c{animation:s3c 3.5s ease-in infinite}@keyframes s3c{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-120px);opacity:0}}

</style>
<defs>
<pattern id="ht" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="3" cy="3" r="1.3" fill="#101114" opacity=".3"/></pattern>
<radialGradient id="vg" cx=".5" cy=".5" r=".75"><stop offset=".5" stop-color="#101114" stop-opacity="0"/><stop offset="1" stop-color="#101114" stop-opacity=".6"/></radialGradient>
</defs>
<rect width="400" height="800" fill="#101114"/><rect y="414" width="400" height="386" fill="#e5dac0"/><rect y="410" width="400" height="6" fill="#101114"/>
