<rect x="60" y="150" width="280" height="360" fill="#1c1e24" stroke="#101114" stroke-width="5"/>
<rect x="80" y="170" width="240" height="320" fill="#e8b23a"/>
<circle cx="200" cy="330" r="96" fill="#101114"/>
<circle cx="200" cy="330" r="84" fill="#f1e9d2" opacity=".9"/>
<g fill="#e8b23a"><circle cx="170" cy="380" r="16"/><circle cx="205" cy="390" r="16"/><circle cx="238" cy="378" r="16"/><circle cx="188" cy="352" r="16"/><circle cx="222" cy="358" r="16"/></g>
<g fill="none" stroke="#101114" stroke-width="2.5"><circle cx="170" cy="380" r="16"/><circle cx="205" cy="390" r="16"/><circle cx="238" cy="378" r="16"/><circle cx="188" cy="352" r="16"/><circle cx="222" cy="358" r="16"/></g>
<g transform="translate(200 330)"><g class="s3d"><circle cx="0" cy="0" r="96" fill="#1c1e24" stroke="#101114" stroke-width="4" transform="translate(96 0) scale(1 1) translate(-96 0)"/><circle cx="0" cy="0" r="60" fill="none" stroke="#e5dac0" stroke-width="3" opacity=".7"/><rect x="-6" y="-60" width="12" height="120" fill="#e5dac0" opacity=".5"/><circle cx="0" cy="0" r="16" fill="#d9202f" stroke="#101114" stroke-width="3"/></g></g>
<g class="s3c"><circle cx="150" cy="300" r="5" fill="#f1e9d2"/></g><g class="s3c" style="animation-delay:-1.2s"><circle cx="250" cy="320" r="4" fill="#e8b23a"/></g><g class="s3c" style="animation-delay:-2.3s"><circle cx="205" cy="290" r="4" fill="#f1e9d2"/></g>
