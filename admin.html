<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel · Saldo Zero</title>
<style>
:root{--bg:#0d1020;--panel:#171b33;--line:#2c3152;--fg:#f4f1ea;--mute:#9ea4c4;--gold:#f5c04a;--green:#4fd39a;--red:#ff5c70;--blue:#59a9ff;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
header b{font-size:18px;letter-spacing:1px}header b span{color:var(--gold)}
nav{display:flex;gap:6px;flex-wrap:wrap}nav button{background:var(--panel);border:1px solid var(--line);color:var(--mute);border-radius:9px;padding:8px 12px;cursor:pointer;font:inherit}nav button.on{color:var(--gold);border-color:var(--gold)}
main{max-width:1200px;margin:0 auto;padding:18px 20px 60px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.card small{color:var(--mute);text-transform:uppercase;letter-spacing:1px;font-size:10px;font-weight:700}.card b{display:block;font-size:26px;margin-top:4px;font-variant-numeric:tabular-nums}.card i{color:var(--mute);font-style:normal;font-size:12px}
h2{font-size:16px;margin:22px 0 10px;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-size:11px;letter-spacing:1px;text-transform:uppercase}tr:hover td{background:#ffffff06}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.5px}.ok{background:#1f5a44;color:#bff5dc}.warn{background:#5a4a1f;color:#ffe7a3}.bad{background:#5a1f2a;color:#ffc2cb}.off{background:#2b3050;color:#c9cde6}
input,select,textarea,button.act{font:inherit;color:var(--fg);background:#0a0c18;border:1px solid var(--line);border-radius:9px;padding:8px 10px}textarea{width:100%;min-height:80px}
button.act{cursor:pointer;background:var(--panel)}button.act:hover{border-color:var(--gold)}button.act.danger{color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.login{max-width:420px;margin:80px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}.login p{color:var(--mute)}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;display:grid;gap:12px}
.muted{color:var(--mute)}.right{text-align:right}.mono{font-family:ui-monospace,monospace;font-size:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2a1b05;padding:10px 16px;border-radius:10px;font-weight:700;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><b>SALDO <span>ZERO</span> · painel</b><nav id="nav" hidden><button data-v="overview" class="on">Visão geral</button><button data-v="orders">Vendas</button><button data-v="users">Usuários</button><button data-v="tickets">Chamados</button><button id="logout">Sair</button></nav></header>
<main>
  <div class="login" id="login"><h2 style="margin-top:0">Acesso do desenvolvedor</h2><p>Cole o token definido na variável <code>ADMIN_TOKEN</code> do servidor.</p><div class="row"><input id="tok" type="password" placeholder="ADMIN_TOKEN" style="flex:1"><button class="act" id="enter">Entrar</button></div><p id="loginErr" style="color:var(--red)"></p></div>

  <section id="v-overview" hidden>
    <div class="cards" id="ovCards"></div>
    <h2>Receita por produto</h2><div class="tbl"><table id="ovProducts"></table></div>
    <h2>Desafio diário · jogadores por dia</h2><div class="tbl"><table id="ovDaily"></table></div>
  </section>

  <section id="v-orders" hidden>
    <h2>Vendas (últimas 200)</h2><div class="tbl"><table id="ordersTbl"></table></div>
  </section>

  <section id="v-users" hidden>
    <div class="row" style="margin-bottom:10px"><input id="uq" placeholder="buscar apelido" style="flex:1;max-width:320px"><button class="act" id="usearch">Buscar</button><span class="muted" id="ucount"></span></div>
    <div class="tbl"><table id="usersTbl"></table></div>
    <div class="detail" id="udetail" hidden></div>
  </section>

  <section id="v-tickets" hidden>
    <div class="row" style="margin-bottom:10px"><select id="tstatus"><option value="">todos</option><option value="aberto" selected>abertos</option><option value="respondido">respondidos</option><option value="fechado">fechados</option></select><button class="act" id="tload">Atualizar</button></div>
    <div id="ticketList"></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('adminToken')||'';
const brl=v=>'R$ '+(Number(v)||0).toFixed(2).replace('.',',');const dt=ms=>ms?new Date(ms).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
async function api(path,opts={}){const r=await fetch(path,Object.assign({cache:'no-store'},opts,{headers:Object.assign({'content-type':'application/json','x-admin-token':token},opts.headers||{})}));const d=await r.json().catch(()=>({}));if(r.status===401){sessionStorage.removeItem('adminToken');token='';show('login');throw new Error(d.error||'Token inválido')}if(!r.ok)throw new Error(d.error||'Erro');return d}
function show(v){['overview','orders','users','tickets'].forEach(x=>$('v-'+x).hidden=x!==v);$('login').hidden=v!=='login';$('nav').hidden=v==='login';document.querySelectorAll('#nav button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='overview')loadOverview();if(v==='orders')loadOrders();if(v==='users')loadUsers();if(v==='tickets')loadTickets()}
document.querySelectorAll('#nav button[data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));
$('logout').onclick=()=>{sessionStorage.removeItem('adminToken');token='';show('login')};
$('enter').onclick=async()=>{token=$('tok').value.trim();$('loginErr').textContent='';try{await api('/api/admin/overview');sessionStorage.setItem('adminToken',token);show('overview')}catch(e){$('loginErr').textContent=e.message}};
$('tok').addEventListener('keydown',e=>{if(e.key==='Enter')$('enter').click()});

const statusPill=s=>({RECEIVED:'ok',CONFIRMED:'ok',RECEIVED_IN_CASH:'ok',PENDING:'warn',OVERDUE:'bad',REFUNDED:'bad',DELETED:'off'})[s]||'off';
async function loadOverview(){const d=await api('/api/admin/overview');
  $('ovCards').innerHTML=[['Receita total',brl(d.revenue.all.total),d.revenue.all.n+' vendas pagas'],['Receita no mês',brl(d.revenue.month.total),d.revenue.month.n+' vendas'],['Receita hoje',brl(d.revenue.today.total),d.revenue.today.n+' vendas'],['Cobranças pendentes',d.revenue.pending,'aguardando pagamento'],['Usuários',d.users.total,d.users.today+' novos hoje · '+d.users.active7d+' ativos em 7 dias'],['Bloqueados',d.users.blocked,''],['Chamados abertos',d.tickets.open,d.tickets.total+' no total']].map(c=>'<div class="card"><small>'+c[0]+'</small><b>'+c[1]+'</b><i>'+c[2]+'</i></div>').join('');
  $('ovProducts').innerHTML='<tr><th>Produto</th><th class="right">Vendas</th><th class="right">Receita</th></tr>'+(d.revenue.byProduct.map(p=>'<tr><td>'+esc(p.name)+'</td><td class="right">'+p.n+'</td><td class="right">'+brl(p.total)+'</td></tr>').join('')||'<tr><td colspan="3" class="muted">Nenhuma venda paga ainda.</td></tr>');
  $('ovDaily').innerHTML='<tr><th>Dia</th><th class="right">Jogadores no diário</th></tr>'+(d.daily.map(r=>'<tr><td>'+r.day+'</td><td class="right">'+r.n+'</td></tr>').join('')||'<tr><td colspan="2" class="muted">Ninguém jogou o diário ainda.</td></tr>')}
async function loadOrders(){const d=await api('/api/admin/orders');
  $('ordersTbl').innerHTML='<tr><th>Data</th><th>Produto</th><th>Jogador</th><th>Status</th><th class="right">Valor</th><th>Pago em</th><th>Cobrança</th></tr>'+(d.orders.map(o=>'<tr><td>'+dt(o.created_at)+'</td><td>'+esc(o.name)+'</td><td>'+(o.nick?'@'+esc(o.nick):'<span class="muted">sem conta</span>')+'</td><td><span class="pill '+statusPill(o.status)+'">'+o.status+'</span></td><td class="right">'+brl(o.value)+'</td><td>'+dt(o.paid_at)+'</td><td class="mono">'+esc(o.payment_id)+'</td></tr>').join('')||'<tr><td colspan="7" class="muted">Nenhuma cobrança ainda.</td></tr>')}
async function loadUsers(){const d=await api('/api/admin/users?q='+encodeURIComponent($('uq').value.trim()));$('ucount').textContent=d.total+' usuário(s)';
  $('usersTbl').innerHTML='<tr><th>Apelido</th><th>E-mail</th><th>Criado</th><th>Visto</th><th class="right">Favores</th><th class="right">Itens</th><th class="right">Gasto</th><th class="right">Diários</th><th>Status</th></tr>'+(d.rows.map(u=>'<tr style="cursor:pointer" data-id="'+u.id+'"><td><b>@'+esc(u.nick)+'</b>'+(u.vip?' <span class="pill warn">VIP</span>':'')+(u.note?'<br><small class="muted">'+esc(u.note)+'</small>':'')+'</td><td>'+(u.email?esc(u.email)+(u.email_verified?' <span class="pill ok">ok</span>':' <span class="pill warn">não confirmado</span>'):'<span class="muted">sem e-mail</span>')+'</td><td>'+dt(u.created_at)+'</td><td>'+dt(u.last_seen)+'</td><td class="right">'+u.favores+'</td><td class="right">'+u.items+'</td><td class="right">'+brl(u.spent)+'</td><td class="right">'+u.games+'</td><td>'+(u.blocked?'<span class="pill bad">bloqueado</span>':'<span class="pill ok">ativo</span>')+'</td></tr>').join('')||'<tr><td colspan="9" class="muted">Nenhum usuário.</td></tr>');
  $('usersTbl').querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>openUser(+tr.dataset.id))}
$('usearch').onclick=loadUsers;$('uq').addEventListener('keydown',e=>{if(e.key==='Enter')loadUsers()});
let products=[];fetch('/api/store/config').then(r=>r.json()).then(c=>{products=c.products||[]}).catch(()=>{});
async function openUser(id){const d=await api('/api/admin/users/'+id);const u=d.user;const el=$('udetail');el.hidden=false;
  el.innerHTML='<div class="row" style="justify-content:space-between"><div><b style="font-size:18px">@'+esc(u.nick)+'</b> <span class="muted">#'+u.id+' · '+(u.email?esc(u.email)+(u.email_verified?' (confirmado)':' (não confirmado)'):'sem e-mail')+' · criado '+dt(u.created_at)+' · visto '+dt(u.last_seen)+'</span></div>'+(u.blocked?'<span class="pill bad">bloqueado</span>':'<span class="pill ok">ativo</span>')+'</div>'+
  '<div class="row"><b>🎩 '+u.favores+' favores</b> <input id="favN" type="number" value="10" style="width:90px"><button class="act" data-a="favores">Dar / tirar favores</button>'+
  '<select id="grantP">'+products.map(p=>'<option value="'+p.id+'">'+p.id.replace('com.saldozero.','')+'</option>').join('')+'</select><button class="act" data-a="grant">Dar produto</button><button class="act" data-a="revoke">Remover produto</button></div>'+
  '<div class="row"><input id="newPin" placeholder="nova senha" style="width:140px"><button class="act" data-a="pin">Trocar senha</button><input id="newNick" placeholder="novo apelido" style="width:160px"><button class="act" data-a="rename">Renomear</button>'+(u.blocked?'<button class="act" data-a="unblock">Desbloquear</button>':'<button class="act danger" data-a="block">Bloquear</button>')+'<button class="act danger" data-a="delete">Excluir conta</button></div>'+
  '<div class="row">'+(u.email&&!u.email_verified?'<button class="act" data-a="verify">Marcar e-mail como confirmado</button>':'')+'<input id="noteI" placeholder="anotação interna" value="'+esc(u.note)+'" style="flex:1"><button class="act" data-a="note">Salvar anotação</button></div>'+
  '<div class="row">'+(u.code_kind&&u.code_expires>Date.now()?'<span class="muted">Código pendente ('+(u.code_kind==='reset'?'troca de senha':'confirmação de e-mail')+') até '+dt(u.code_expires)+'. Ele fica só em hash.</span> ':'')+'<button class="act" data-a="newcode" data-k="verify">Gerar código de confirmação</button><button class="act" data-a="newcode" data-k="reset">Gerar código de troca de senha</button>'+(u.locked_until>Date.now()||u.pin_fails?'<button class="act" data-a="unlock">Desbloquear senha ('+u.pin_fails+' erros)</button>':'')+'</div>'+
  '<div><b>Itens:</b> '+(d.entitlements.map(e=>e.product_id.replace('com.saldozero.','')+' <span class="muted">('+dt(e.created_at)+')</span>').join(', ')||'<span class="muted">nenhum</span>')+'</div>'+
  '<div><b>Compras:</b> '+(d.orders.map(o=>o.product_id.replace('com.saldozero.','')+' '+brl(o.value)+' <span class="pill '+statusPill(o.status)+'">'+o.status+'</span>').join(' · ')||'<span class="muted">nenhuma</span>')+'</div>'+
  '<div><b>Diários:</b> '+(d.results.map(r=>r.day+': '+r.days+'d '+r.ending).join(' · ')||'<span class="muted">nenhum</span>')+'</div>'+
  '<div><b>Chamados:</b> '+(d.tickets.map(t=>'#'+t.id+' '+t.subject+' ('+t.status+')').join(' · ')||'<span class="muted">nenhum</span>')+'</div>'+
  '<div><b>Progresso:</b> <span class="mono">'+esc(JSON.stringify(JSON.parse(u.progress||'{}')))+'</span></div>';
  el.querySelectorAll('button[data-a]').forEach(b=>b.onclick=async()=>{const a=b.dataset.a;const body={action:a};
    if(a==='favores')body.n=Number($('favN').value);if(a==='grant'||a==='revoke')body.productId=$('grantP').value;if(a==='pin')body.pin=$('newPin').value;if(a==='rename')body.nick=$('newNick').value;if(a==='note')body.note=$('noteI').value;if(a==='newcode')body.kind=b.dataset.k;
    if((a==='delete'||a==='block')&&!window.confirm(a==='delete'?'Excluir a conta e todos os dados do jogador?':'Bloquear este jogador? Ele perde o acesso imediatamente.'))return;
    try{const r=await api('/api/admin/users/'+id,{method:'POST',body:JSON.stringify(body)});if(r&&r.code){window.alert('Código ('+(r.kind==='reset'?'troca de senha':'confirmação')+'), válido por 30 min. Passe só ao dono da conta: '+r.code)}toast('Feito');if(a==='delete'){el.hidden=true}else openUser(id);loadUsers()}catch(e){toast(e.message)}})}
async function loadTickets(){const d=await api('/api/admin/tickets?status='+encodeURIComponent($('tstatus').value));
  $('ticketList').innerHTML=d.tickets.map(t=>'<div class="detail" style="margin-top:10px"><div class="row" style="justify-content:space-between"><div><b>#'+t.id+' · '+esc(t.subject)+'</b> <span class="muted">'+dt(t.created_at)+' · '+(t.user_nick?'@'+esc(t.user_nick):(t.nick?esc(t.nick):'sem conta'))+(t.email?' · '+esc(t.email):'')+'</span></div><span class="pill '+({aberto:'warn',respondido:'ok',fechado:'off'})[t.status]+'">'+t.status+'</span></div><div style="white-space:pre-wrap">'+esc(t.message)+'</div><textarea id="r'+t.id+'" placeholder="Resposta ao jogador (aparece no menu Ajuda dele)">'+esc(t.reply||'')+'</textarea><div class="row"><button class="act" data-id="'+t.id+'" data-s="respondido">Responder</button><button class="act" data-id="'+t.id+'" data-s="fechado">Fechar</button><button class="act" data-id="'+t.id+'" data-s="aberto">Reabrir</button></div></div>').join('')||'<p class="muted">Nenhum chamado.</p>';
  $('ticketList').querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{try{await api('/api/admin/tickets/'+b.dataset.id,{method:'POST',body:JSON.stringify({status:b.dataset.s,reply:$('r'+b.dataset.id).value})});toast('Salvo');loadTickets()}catch(e){toast(e.message)}})}
$('tload').onclick=loadTickets;$('tstatus').onchange=loadTickets;
if(token){api('/api/admin/overview').then(()=>show('overview')).catch(()=>show('login'))}else show('login');
</script>
</body>
</html>
